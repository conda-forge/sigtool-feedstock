{% set version = "0.2.1" %}

package:
  name: sigtool-split
  version: {{ version }}

source:
  url: https://github.com/thefloweringash/sigtool/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 403bfbe831bfbe7de009099fade3b070b7e0d0c950e4a59a4f726f139513b5b8
  patches:
    - 0001-find-codesign_allocate-next-to-it.patch
    - 0002-include-cstdint.patch

build:
  number: 0
  skip: true  # [win]

requirements:
  build:
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - cmake
    - make
  host:
    - openssl

outputs:
  - name: libsigtool
    files:
      - lib/libsigtool*
    requirements:
      build:
        - {{ compiler('cxx') }}
        - {{ stdlib('c') }}
        - cmake
        - make
      host:
        - openssl
    test:
      commands:
        - test -f ${PREFIX}/lib/libsigtool${SHLIB_EXT}

  - name: sigtool-codesign
    files:
      - bin/sigtool-codesign
    requirements:
      build:
        - {{ compiler('cxx') }}
        - {{ stdlib('c') }}
        - cmake
        - make
      host:
        - openssl
      run:
        - {{ pin_subpackage("libsigtool", exact=True) }}
    test:
      commands:
        - sigtool-codesign -h

  - name: sigtool
    files:
      - bin/sigtool
      - bin/codesign
      - include/sigtool
    requirements:
      build:
        - {{ compiler('cxx') }}
        - {{ stdlib('c') }}
        - cmake
        - make
      host:
        - openssl
      run:
        - {{ pin_subpackage("libsigtool", exact=True) }}
        - {{ pin_subpackage("sigtool-codesign", exact=True) }}
    test:
      commands:
        - sigtool-codesign -h

about:
  home: https://github.com/thefloweringash/sigtool
  license: MIT
  license_file: LICENSE
  summary: A minimal multicall binary providing helpers for working with embedded signatures in Mach-O files.

extra:
  feedstock-name: sigtool
  recipe-maintainers:
    - isuruf
